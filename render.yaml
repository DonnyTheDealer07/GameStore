services:
  - type: web
    name: neonbyte-api
    runtime: node
    plan: free
    branch: neonbyte-production
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: neonbyte
      - key: FRONTEND_ORIGINS
        sync: false
